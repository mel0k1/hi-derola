[package]
name = "hi-derola"
version = "0.2.0"
edition = "2021"
description = "Minimalist dark chat coding assistant for multiple LLM providers (GUI + TUI)"

[workspace]
members = ["src-tauri"]

[lib]
name = "hi_derola"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
boa_engine = "0.20"
async-trait = "0.1"
base64 = "0.22"
crossterm = "0.28"
dirs = "5"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
regex = "1"
fatfs = "0.3"
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "std", "ed25519", "getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Win32_Security is required: CreateJobObjectW takes a *const SECURITY_ATTRIBUTES
# and windows-sys only compiles it when the type's feature is on
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[profile.release]
strip = true
lto = true

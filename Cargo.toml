[package]
name = "hi-derola"
version = "0.1.0"
edition = "2021"
description = "Minimal dark TUI coding chat for multiple LLM providers"

[dependencies]
anyhow = "1"
async-trait = "0.1"
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
toml = "0.8"

[profile.release]
strip = true
lto = true

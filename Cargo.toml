[package]
name = "hi-derola"
version = "0.1.0"
edition = "2021"
description = "Minimalist dark chat coding assistant for multiple LLM providers (Slint GUI + TUI)"

[dependencies]
anyhow = "1"
async-trait = "0.1"
crossterm = "0.28"
dirs = "5"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
slint = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process"] }
toml = "0.8"

[build-dependencies]
slint-build = "1"

[profile.release]
strip = true
lto = true

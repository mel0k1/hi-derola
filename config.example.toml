

[provider]

type = "openai"

model = "anthropic/claude-sonnet-4.5"

base_url = "https://openrouter.ai/api/v1"

api_key = ""

max_tokens = 4096

stream = true

[keys]
send = "enter"
newline = "shift+enter"
stop = "escape"
new_session = "ctrl+n"
open_settings = "ctrl+comma"
undo = "ctrl+z"
redo = "ctrl+shift+z"
toggle_thinking = "ctrl+t"
toggle_sidebar = "ctrl+b"
toggle_theme = "ctrl+shift+t"

[ui]

[agent]

context_limit = 0

max_rounds = 15

output_budget = 32768

subagent_depth = 1

[lsp]
enabled = true

[formatters]
enabled = true

[permissions]


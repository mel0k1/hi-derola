[package]
name = "hi-derola-gui"
version = "0.2.0"
edition = "2021"
description = "Hi!Derola desktop GUI (tauri)"
build = "build.rs"

[lib]
name = "hiderola_gui"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "hi-derola-gui"
path = "src/main.rs"

[dependencies]
hi-derola = { path = ".." }
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
rfd = "0.15"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

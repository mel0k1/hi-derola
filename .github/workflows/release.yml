name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # raw binaries named hi-derola-<target-triple>[.exe] — exactly what
  # src/update.rs looks for on `hi-derola update`
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --quiet
      - name: stage asset (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/hi-derola.exe "dist/hi-derola-${{ matrix.target }}.exe"
      - name: stage asset (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/hi-derola "dist/hi-derola-${{ matrix.target }}"
      - name: attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
